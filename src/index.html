<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Concesionarios</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root>
      <!-- Pantalla de carga mientras arranca la app (Angular la reemplaza al iniciar). -->
      <div
        role="status"
        style="position: fixed; inset: 0; display: grid; place-items: center; background: #fafafa; font-family: Inter, system-ui, sans-serif; color: #71717a"
      >
        <div style="display: flex; flex-direction: column; align-items: center; gap: 16px">
          <span
            style="width: 32px; height: 32px; border-radius: 50%; border: 3px solid #e4e4e7; border-top-color: #18181b; animation: girar 0.8s linear infinite"
          ></span>
          <span style="font-size: 14px">Cargando Concesionaria…</span>
        </div>
      </div>
      <style>
        @keyframes girar {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </app-root>
  </body>
</html>
