<div class="flex flex-col gap-6">
  <header class="flex flex-col gap-1">
    <h1 class="text-h2">Mi cuenta</h1>
    <p class="text-sm text-fg-muted">Tus datos y tu contraseña</p>
  </header>

  <div class="grid gap-6 lg:grid-cols-3 lg:items-start">
    <section class="tarjeta flex flex-col gap-4 p-6" aria-labelledby="t-datos">
      <h2 id="t-datos" class="text-h4">Datos</h2>
      @if (yo(); as u) {
        <dl class="grid gap-3 text-sm">
          <div class="flex flex-col gap-0.5">
            <dt class="text-fg-muted">Nombre</dt>
            <dd class="font-medium">{{ u.nombre }} {{ u.apellido }}</dd>
          </div>
          <div class="flex flex-col gap-0.5">
            <dt class="text-fg-muted">Email</dt>
            <dd>{{ u.email }}</dd>
          </div>
          <div class="flex flex-col gap-0.5">
            <dt class="text-fg-muted">Rol</dt>
            <dd>{{ nombreRol[u.rol] }}</dd>
          </div>
          <div class="flex flex-col gap-0.5">
            <dt class="text-fg-muted">Cuenta creada</dt>
            <dd>{{ formatearFecha(u.fechaCreacion) }}</dd>
          </div>
        </dl>
        <p class="text-xs text-fg-muted">Para cambiar estos datos, hablá con un administrador.</p>
      } @else {
        <app-esqueleto-lineas [lineas]="4" />
      }
    </section>

    <app-cambiar-password class="lg:col-span-2" />
  </div>
</div>
