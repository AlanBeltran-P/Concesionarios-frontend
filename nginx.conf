server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Rutas de Angular (/vehiculos/3, /cuenta, /panel/ventas...): si no es un archivo, devolver index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html nunca se cachea, así el navegador siempre toma la última versión
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Los JS y CSS llevan un hash en el nombre: se pueden cachear por mucho tiempo
  location ~* \.(js|css|woff2?|ico|png|jpg|svg|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
